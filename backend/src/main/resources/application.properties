server.port=${PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.config.import=optional:file:./.env.properties
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/submissions;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USER:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.sql.init.mode=always
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spc.mail.enabled=${MAIL_ENABLED:false}
spc.mail.from=${MAIL_FROM:}
spc.mail.recipient=${MAIL_TO:liamparkerstealth@gmail.com}
spc.worker.enabled=true
